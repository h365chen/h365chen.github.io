name: Integration tests

on:
  push:
    branches:
      - master
      - main
      - v1.0-dev
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "assets/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    branches:
      - master
      - main
      - v1.0-dev
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "assets/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/unit-tests.yml"

jobs:
  comments-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS deps 📦
        run: npm ci

      # `npm run lint:style-contract` is the al-folio starter's own thin-starter
      # gate: it fails whenever `_sass/`, `_layouts/` or `_includes/` exists.
      # A site created from the template may legally shadow gem-owned files, so
      # the gate is skipped here. Run it against the upstream starter repo only.

      - name: Install build prerequisites 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert

      # Four of the starter's seven integration scripts assert against the
      # starter's own demo content and therefore cannot pass on a site that
      # does not carry it. They are skipped here, with the reason:
      #
      #   integration_comments.sh      needs blog/2022/giscus-comments
      #   integration_distill.sh       needs blog/2021/distill
      #   integration_new_plugins.sh   needs blog/2022/rtl, blog/2025/marimo
      #     -> this site keeps the example posts in _template_posts/, excluded
      #   integration_bootstrap_compat.sh
      #     -> asserts the compat stylesheet is absent from a default build,
      #        but this site turns al_folio.compat.bootstrap on deliberately
      #
      # The remaining three are independent of content and still run here.

      - name: Run plugin toggle integration test 🔌
        run: bash test/integration_plugin_toggles.sh

      - name: Run upgrade CLI integration test ⬆️
        run: bash test/integration_upgrade_cli.sh

      - name: Run CSS minify integration test 🎨
        run: bash test/integration_css_minify.sh
